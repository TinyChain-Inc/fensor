[package]
name = "fensor"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A filesystem-backed Tensor with dense and sparse indexing"
repository = "https://github.com/TinyChain-Inc/fensor"

[dependencies]
b-table = { path = "../b-table", features = ["stream"] }
destream = { path = "../destream", version = "0.10" }
freqfs = { path = "../freqfs", version = "0.13" }
ha-ndarray = { path = "../ha-ndarray", version = "0.5" }
futures = "0.3"
rand = "0.8"
safecast = "0.2"
smallvec = "1"
num_cpus = "1.17.0"
number-general = { path = "../number-general", version = "0.14" }

[dev-dependencies]
num-rational = "0.4"
num-traits = "0.2"
tbon = { path = "../tbon", version = "0.9", features = ["tokio-io"] }
destream_json = { path = "../destream_json", version = "0.15", features = ["tokio-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
